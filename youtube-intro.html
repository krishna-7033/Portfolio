<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Intro - Smooth & Professional</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Poppins",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #1e3c72 0%,
          #2a5298 50%,
          #7e57c2 100%
        );
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }

      .intro-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Background animations */
      .bg-gradient {
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(255, 107, 107, 0.15),
          transparent
        );
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: bgPulse 4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        pointer-events: none;
        will-change: transform;
      }

      .bg-accent {
        position: absolute;
        width: 350px;
        height: 350px;
        border: 2px solid rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: rotateBg 10s linear forwards;
        pointer-events: none;
        will-change: transform;
      }

      /* Main content */
      .content {
        position: relative;
        z-index: 10;
        text-align: center;
        will-change: transform, opacity;
      }

      .title {
        font-size: 5rem;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.1;
        margin-bottom: 15px;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
        animation: titleEnter 1.1s cubic-bezier(0.05, 0.7, 0.1, 1) forwards;
        opacity: 0;
        will-change: transform, opacity;
      }

      .subtitle {
        font-size: 1.6rem;
        color: rgba(255, 255, 255, 0.95);
        font-weight: 400;
        letter-spacing: 3px;
        margin-bottom: 50px;
        animation: subtitleEnter 1.1s cubic-bezier(0.05, 0.7, 0.1, 1) 0.15s forwards,
                  shimmer 3s ease-in-out 1.5s infinite;
        opacity: 0;
        will-change: transform, opacity;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 1), rgba(255, 255, 255, 0.8));
        background-size: 200% 100%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Animated lines */
      .line-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
        margin-bottom: 30px;
      }

      .line {
        width: 2px;
        height: 60px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0.7) 50%,
          rgba(255, 255, 255, 0)
        );
        animation: lineGrow 1s cubic-bezier(0.25, 0.45, 0.45, 0.95) 0.35s forwards,
                  linePulse 2s ease-in-out 1.4s infinite;
        transform-origin: center;
        opacity: 0;
        will-change: transform, opacity;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      }

      .line:nth-child(2) {
        animation-delay: 0.45s;
      }

      .line:nth-child(3) {
        animation-delay: 0.55s;
      }

      /* Glow effect circles */
      .glow-circle {
        position: absolute;
        border-radius: 50%;
        animation: glowFloat 4s cubic-bezier(0.25, 0.45, 0.45, 0.95) forwards;
        pointer-events: none;
        will-change: transform, opacity;
      }

      .glow-1 {
        width: 140px;
        height: 140px;
        background: radial-gradient(
          circle,
          rgba(255, 107, 107, 0.35),
          transparent
        );
        top: 25%;
        left: 12%;
      }

      .glow-2 {
        width: 110px;
        height: 110px;
        background: radial-gradient(
          circle,
          rgba(107, 200, 255, 0.35),
          transparent
        );
        bottom: 20%;
        right: 8%;
        animation-delay: 0.2s;
      }

      .glow-3 {
        width: 120px;
        height: 120px;
        background: radial-gradient(
          circle,
          rgba(255, 200, 100, 0.25),
          transparent
        );
        top: 65%;
        right: 5%;
        animation-delay: 0.4s;
      }

      /* Keyframe animations */
      @keyframes titleEnter {
        0% {
          opacity: 0;
          transform: translateY(40px) scaleX(0.95);
          letter-spacing: -4px;
        }
        100% {
          opacity: 1;
          transform: translateY(0) scaleX(1);
          letter-spacing: -2px;
        }
      }

      @keyframes subtitleEnter {
        0% {
          opacity: 0;
          transform: translateY(25px);
          letter-spacing: 0px;
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          letter-spacing: 3px;
        }
      }

      @keyframes lineGrow {
        0% {
          opacity: 0;
          transform: scaleY(0);
        }
        100% {
          opacity: 1;
          transform: scaleY(1);
        }
      }

      @keyframes bgPulse {
        0% {
          transform: translate(-50%, -50%) scale(0.3);
          opacity: 0.5;
        }
        50% {
          opacity: 0.3;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.3);
          opacity: 0;
        }
      }

      @keyframes rotateBg {
        0% {
          transform: translate(-50%, -50%) rotate(0deg);
          opacity: 0.8;
        }
        100% {
          transform: translate(-50%, -50%) rotate(360deg);
          opacity: 0;
        }
      }

      @keyframes glowFloat {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.3);
        }
        40% {
          opacity: 0.7;
        }
        100% {
          opacity: 0;
          transform: translate(0, -100px) scale(0.8);
        }
      }

      @keyframes fadeOut {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(0.98);
        }
      }

      .content.fade {
        animation: fadeOut 0.7s cubic-bezier(0.25, 0.45, 0.45, 0.95) 3.3s
          forwards;
        will-change: opacity, transform;
      }

      /* CTA text */
      .cta {
        position: absolute;
        bottom: 60px;
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 1.5px;
        animation: ctaFade 0.9s cubic-bezier(0.25, 0.45, 0.45, 0.95) 2.9s
          forwards;
        opacity: 0;
        will-change: opacity;
      }

      @keyframes ctaFade {
        0% {
          opacity: 0;
          transform: translateY(10px);
        }
        100% {
          opacity: 0.6;
          transform: translateY(0);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% center;
        }
        50% {
          background-position: 200% center;
        }
        100% {
          background-position: -200% center;
        }
      }

      @keyframes linePulse {
        0%, 100% {
          box-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 30px rgba(255, 255, 255, 0.2);
        }
        50% {
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.4);
        }
      }

      /* Download Button */
      .download-btn {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 35px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 1px;
        border-radius: 50px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        animation: btnFadeIn 0.8s cubic-bezier(0.25, 0.45, 0.45, 0.95) 3.1s forwards,
                  btnGlow 2s ease-in-out 3.5s infinite;
        opacity: 0;
        will-change: transform, opacity, box-shadow;
        transition: all 0.3s ease;
        z-index: 20;
      }

      .download-btn:hover {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
        border-color: rgba(255, 255, 255, 0.6);
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1);
        transform: translateX(-50%) scale(1.05);
      }

      .download-btn:active {
        transform: translateX(-50%) scale(0.98);
      }

      @keyframes btnFadeIn {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      @keyframes btnGlow {
        0%, 100% {
          box-shadow: 0 0 15px rgba(255, 255, 255, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05);
        }
        50% {
          box-shadow: 0 0 30px rgba(255, 255, 255, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1);
        }
      }

      /* Responsive */
      @media (max-width: 768px) {
        .title {
          font-size: 3.2rem;
        }

        .subtitle {
          font-size: 1.1rem;
          letter-spacing: 2px;
        }

        .line {
          height: 40px;
        }

        .line-container {
          gap: 15px;
        }

        .cta {
          font-size: 0.85rem;
        }

        .download-btn {
          padding: 10px 25px;
          font-size: 0.85rem;
          bottom: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="intro-container">
      <!-- Background effects -->
      <div class="bg-gradient"></div>
      <div class="bg-accent"></div>

      <!-- Floating glow circles -->
      <div class="glow-circle glow-1"></div>
      <div class="glow-circle glow-2"></div>
      <div class="glow-circle glow-3"></div>

      <!-- Main content -->
      <div class="content fade">
        <h1 class="title">Welcome</h1>
        <p class="subtitle">SUBSCRIBE & HIT BELL</p>

        <div class="line-container">
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
        </div>
      </div>

      <p class="cta">Don't forget to like & subscribe!</p>

      <!-- Download Button -->
      <button class="download-btn" onclick="downloadVideo()">⬇ DOWNLOAD VIDEO</button>
    </div>

    <script>
      function downloadVideo() {
        // Capture canvas from animation
        const canvas = document.createElement('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // For now, we'll create a simple download link
        // In production, you'd use a video library to render
        const link = document.createElement('a');
        link.href = window.location.href;
        link.download = 'youtube-intro.html';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    </script>

</body>
</html>
